<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attractor Forge</title>
<style>
  :root { --bg:#06070a; --panel:rgba(16,18,26,.82); --ink:#e8ecf4; --dim:#8a93a6; --acc:#6ee7ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
  #ui { position:fixed; top:14px; left:14px; width:268px; background:var(--panel);
    backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.08); border-radius:16px;
    padding:16px; font-size:13px; box-shadow:0 18px 50px rgba(0,0,0,.55); user-select:none; }
  #ui h1 { font-size:15px; letter-spacing:.5px; font-weight:700; display:flex; align-items:center; gap:8px; }
  #ui h1 .dot { width:9px; height:9px; border-radius:50%; background:var(--acc);
    box-shadow:0 0 12px var(--acc); animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  .sub { color:var(--dim); font-size:11px; margin:3px 0 14px; line-height:1.4; }
  .row { display:flex; gap:7px; margin-bottom:9px; flex-wrap:wrap; }
  button { flex:1; min-width:0; background:rgba(255,255,255,.05); color:var(--ink);
    border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:8px 6px; font-size:12px;
    cursor:pointer; transition:.15s; white-space:nowrap; }
  button:hover { background:rgba(110,231,255,.16); border-color:var(--acc); }
  button.on { background:rgba(110,231,255,.22); border-color:var(--acc); color:#fff; }
  label.f { display:block; color:var(--dim); font-size:11px; margin:11px 0 4px; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  .badge { font-family:ui-monospace,Menlo,monospace; font-size:10.5px; color:var(--acc);
    background:rgba(110,231,255,.08); border-radius:7px; padding:2px 7px; }
  #hint { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); color:var(--dim);
    font-size:11px; background:var(--panel); padding:6px 14px; border-radius:20px;
    border:1px solid rgba(255,255,255,.07); backdrop-filter:blur(8px); }
  #fps { position:fixed; top:14px; right:14px; font-family:ui-monospace,monospace; font-size:11px;
    color:var(--dim); background:var(--panel); padding:5px 10px; border-radius:9px;
    border:1px solid rgba(255,255,255,.07); }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="fps">—</div>
<div id="ui">
  <h1><span class="dot"></span>Attractor Forge</h1>
  <div class="sub">Plotting millions of points of chaos in real time. Drag the canvas to reshape the universe.</div>
  <div class="row" id="types"></div>
  <div class="row">
    <button id="rnd">🎲 Randomize</button>
    <button id="morph" class="on">🌊 Morph</button>
  </div>
  <div class="row">
    <button id="pal">🎨 Palette</button>
    <button id="save">💾 PNG</button>
  </div>
  <div class="row">
    <button id="audio">🎤 React to sound</button>
  </div>
  <label class="f">Detail · points/frame <span class="badge" id="dN">120k</span></label>
  <input type="range" id="density" min="20000" max="400000" step="20000" value="120000">
  <label class="f">Glow <span class="badge" id="dG">0.85</span></label>
  <input type="range" id="glow" min="0" max="1" step="0.01" value="0.85">
  <label class="f">Zoom <span class="badge" id="dZ">1.00×</span></label>
  <input type="range" id="zoom" min="0.4" max="3" step="0.01" value="1">
  <div class="sub" style="margin:12px 0 0" id="params"></div>
</div>
<div id="hint">drag = sculpt params · scroll = zoom · these shapes have never existed before</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha:false });
let W,H,DPR;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px'; }
addEventListener('resize',resize); resize();

// ---- attractor families: each maps (x,y,p[]) -> (x,y) and has a sane param range ----
const FAMILIES = {
  Clifford: { n:4, span:2.5, f:(x,y,p)=>[Math.sin(p[0]*y)+p[2]*Math.cos(p[0]*x), Math.sin(p[1]*x)+p[3]*Math.cos(p[1]*y)] },
  DeJong:   { n:4, span:2.5, f:(x,y,p)=>[Math.sin(p[0]*y)-Math.cos(p[1]*x), Math.sin(p[2]*x)-Math.cos(p[3]*y)] },
  Svensson: { n:4, span:1.9, f:(x,y,p)=>[p[3]*Math.sin(p[0]*x)-Math.sin(p[1]*y), p[2]*Math.cos(p[0]*x)+Math.cos(p[1]*y)] },
  Bedhead:  { n:2, span:1.3, f:(x,y,p)=>[Math.sin(x*y/3)+p[0]*Math.cos(x+Math.sin(y)), x*Math.sin(y*y-x*x)+p[1]*0+Math.sin(x)] },
  Fractal:  { n:4, span:3.0, f:(x,y,p)=>[Math.sin(p[0]*y)+p[2]*Math.cos(p[0]*x)+0.1*Math.sin(3*x), Math.sin(p[1]*x)+p[3]*Math.cos(p[1]*y)+0.1*Math.cos(3*y)] },
};
const PALETTES = [
  { name:'Aurora', stops:[[8,12,40],[40,180,200],[120,255,210],[230,255,255]] },
  { name:'Ember',  stops:[[20,6,6],[200,40,20],[255,150,30],[255,250,210]] },
  { name:'Neon',   stops:[[10,4,30],[150,30,220],[60,200,255],[255,120,255]] },
  { name:'Mono',   stops:[[4,6,10],[90,110,140],[200,220,255],[255,255,255]] },
  { name:'Acid',   stops:[[6,18,8],[40,200,80],[180,255,40],[245,255,180]] },
];
function lerp(a,b,t){return a+(b-a)*t;}
function ramp(stops,t){ t=Math.max(0,Math.min(1,t)); const s=t*(stops.length-1); const i=Math.floor(s),f=s-i;
  const a=stops[i],b=stops[Math.min(i+1,stops.length-1)];
  return [lerp(a[0],b[0],f),lerp(a[1],b[1],f),lerp(a[2],b[2],f)]; }

let famKey='Clifford', palIdx=0;
let P=[], Ptarget=[], morphing=true;
function randParams(){ const fam=FAMILIES[famKey]; const a=[];
  for(let i=0;i<fam.n;i++) a.push((Math.random()*2-1)*fam.span); return a; }
function setFamily(k){ famKey=k; P=randParams(); Ptarget=P.slice(); newTarget(); drawTypes(); }
function newTarget(){ Ptarget=randParams(); }

// accumulation buffer (float) for proper additive density
let acc, accW, accH;
function allocAcc(){ accW=Math.floor(W/1); accH=Math.floor(H/1); acc=new Float32Array(accW*accH); }
allocAcc();

let zoom=1, glow=0.85, density=120000;
let x=0.1,y=0.1;

// ---- audio reactivity ----
let audioOn=false, analyser=null, freq=null, bass=0, treble=0, beat=0;
async function toggleAudio(){
  const btn=document.getElementById('audio');
  if(audioOn){ audioOn=false; btn.classList.remove('on'); btn.textContent='🎤 React to sound';
    if(window._actx){ window._actx.close(); window._actx=null; } return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const actx=new (window.AudioContext||window.webkitAudioContext)();
    window._actx=actx;
    const src=actx.createMediaStreamSource(stream);
    analyser=actx.createAnalyser(); analyser.fftSize=1024; analyser.smoothingTimeConstant=0.78;
    src.connect(analyser); freq=new Uint8Array(analyser.frequencyBinCount);
    audioOn=true; btn.classList.add('on'); btn.textContent='🎤 Listening…';
  }catch(e){ btn.textContent='🎤 mic blocked'; setTimeout(()=>btn.textContent='🎤 React to sound',1800); }
}
function readAudio(){
  if(!audioOn||!analyser) { bass*=0.9; treble*=0.9; return; }
  analyser.getByteFrequencyData(freq);
  const n=freq.length; let b=0,t=0;
  const bEnd=(n*0.08)|0, tStart=(n*0.45)|0;
  for(let i=0;i<bEnd;i++) b+=freq[i];
  for(let i=tStart;i<n;i++) t+=freq[i];
  const nb=b/(bEnd*255), nt=t/((n-tStart)*255);
  const prevBass=bass;
  bass=bass*0.6+nb*0.4; treble=treble*0.6+nt*0.4;
  beat=Math.max(0,bass-prevBass)*4; // transient on bass rise
}
let dragging=false, dragP=[];

function iterate(count){
  const fam=FAMILIES[famKey].f, p=P;
  const span=FAMILIES[famKey].span;
  // map attractor space (~[-2,2]) to pixels
  const scale=Math.min(accW,accH)/(4.2/zoom);
  const cx=accW/2, cy=accH/2;
  let lx=x,ly=y;
  for(let i=0;i<count;i++){
    const r=fam(lx,ly,p); lx=r[0]; ly=r[1];
    if(!isFinite(lx)||!isFinite(ly)){ lx=Math.random()*0.2; ly=Math.random()*0.2; continue; }
    const px=(lx*scale+cx)|0, py=(ly*scale+cy)|0;
    if(px>=0&&px<accW&&py>=0&&py<accH) acc[py*accW+px]+=1;
  }
  x=lx; y=ly;
}

const img = ctx.createImageData(accW,accH);
function render(){
  // tone-map accumulation -> palette
  const pal=PALETTES[palIdx].stops, data=img.data;
  // find a soft max via running estimate
  let mx=0; for(let i=0;i<acc.length;i+=7){ if(acc[i]>mx) mx=acc[i]; }
  if(mx<1) mx=1;
  const k=1/Math.log(mx*glow*8+1.0001);
  for(let i=0,j=0;i<acc.length;i++,j+=4){
    const v=acc[i];
    if(v===0){ data[j]=6;data[j+1]=7;data[j+2]=10;data[j+3]=255; continue; }
    let t=Math.log(v+1)*k; if(t>1)t=1;
    const c=ramp(pal,t);
    data[j]=c[0]; data[j+1]=c[1]; data[j+2]=c[2]; data[j+3]=255;
  }
  ctx.putImageData(img,0,0);
}

function fade(){ for(let i=0;i<acc.length;i++) acc[i]*=0.90; }

// ---- main loop ----
let last=performance.now(), fpsEl=document.getElementById('fps'), frames=0, facc=0;
function loop(now){
  const dt=now-last; last=now; facc+=dt; frames++;
  if(facc>500){ fpsEl.textContent=Math.round(1000*frames/facc)+' fps'; frames=0; facc=0; }

  readAudio();
  if(morphing && !dragging){
    for(let i=0;i<P.length;i++){ P[i]+=(Ptarget[i]-P[i])*0.012; }
    let d=0; for(let i=0;i<P.length;i++) d+=Math.abs(Ptarget[i]-P[i]);
    if(d<0.02) newTarget();
  }
  // audio drives the shape: bass wobbles a param, beats kick morph speed, treble lifts glow/zoom
  let effGlow=glow, effZoom=zoom, effDensity=density;
  if(audioOn){
    const span=FAMILIES[famKey].span;
    P[0]+=Math.sin(now*0.004)*bass*0.06;
    P[Math.min(2,P.length-1)]+=Math.cos(now*0.005)*bass*0.05;
    if(beat>0.05) newTarget();
    effGlow=Math.min(1,glow+treble*0.7);
    effZoom=zoom*(1+beat*0.5);
    effDensity=Math.min(400000,(density*(0.6+bass*1.6))|0);
  }
  fade();
  const _z=zoom, _g=glow, _d=density; zoom=effZoom; glow=effGlow; density=effDensity;
  iterate(density);
  render();
  zoom=_z; glow=_g; density=_d;
  document.getElementById('params').innerHTML =
    P.map((v,i)=>'p'+i+' '+v.toFixed(3)).join(' &nbsp; ');
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---- UI ----
function drawTypes(){ const wrap=document.getElementById('types'); wrap.innerHTML='';
  Object.keys(FAMILIES).forEach(k=>{ const b=document.createElement('button');
    b.textContent=k; if(k===famKey)b.className='on';
    b.onclick=()=>setFamily(k); wrap.appendChild(b); }); }
drawTypes();

document.getElementById('rnd').onclick=()=>{ P=randParams(); Ptarget=P.slice(); newTarget(); };
const morphBtn=document.getElementById('morph');
morphBtn.onclick=()=>{ morphing=!morphing; morphBtn.classList.toggle('on',morphing); if(morphing)newTarget(); };
document.getElementById('pal').onclick=()=>{ palIdx=(palIdx+1)%PALETTES.length;
  document.getElementById('pal').textContent='🎨 '+PALETTES[palIdx].name; };
document.getElementById('pal').textContent='🎨 '+PALETTES[0].name;
document.getElementById('audio').onclick=toggleAudio;
document.getElementById('save').onclick=()=>{ const a=document.createElement('a');
  a.download='attractor-'+famKey+'-'+Date.now()+'.png'; a.href=cv.toDataURL('image/png'); a.click(); };

const dens=document.getElementById('density');
dens.oninput=()=>{ density=+dens.value; document.getElementById('dN').textContent=(density/1000)+'k'; };
const gl=document.getElementById('glow');
gl.oninput=()=>{ glow=+gl.value; document.getElementById('dG').textContent=glow.toFixed(2); };
const zm=document.getElementById('zoom');
zm.oninput=()=>{ zoom=+zm.value; document.getElementById('dZ').textContent=zoom.toFixed(2)+'×'; };

// drag canvas to sculpt the first two params
let sx,sy,baseP;
cv.addEventListener('pointerdown',e=>{ dragging=true; morphing=false; morphBtn.classList.remove('on');
  sx=e.clientX; sy=e.clientY; baseP=P.slice(); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove',e=>{ if(!dragging)return;
  const dx=(e.clientX-sx)/innerWidth*2.4, dy=(e.clientY-sy)/innerHeight*2.4;
  P[0]=baseP[0]+dx; P[1]=baseP[1]+dy; });
cv.addEventListener('pointerup',e=>{ dragging=false; Ptarget=P.slice(); });
cv.addEventListener('wheel',e=>{ e.preventDefault(); zoom=Math.max(0.4,Math.min(3,zoom*(e.deltaY<0?1.08:0.93)));
  zm.value=zoom; document.getElementById('dZ').textContent=zoom.toFixed(2)+'×'; },{passive:false});

setFamily('Clifford');
</script>
</body>
</html>
